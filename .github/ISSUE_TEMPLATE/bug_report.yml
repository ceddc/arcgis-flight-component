name: Bug report
description: Report a reproducible component or demo defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Component commit or version
      placeholder: v0.2.0 or commit SHA
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: ArcGIS Maps SDK version
      placeholder: 5.1.20
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the scene type, relevant configuration, and exact steps. Do not include tokens or private item data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and browser console output
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
    validations:
      required: true
