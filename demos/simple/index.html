<!--
  Basic flight demo page. It supplies a Matterhorn ArcGIS scene, the flight
  component, and a Calcite shell; main.ts registers the elements and shared UI.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Minimal Matterhorn scene integration for the ArcGIS Flight Component."
    />
    <title>Basic flight demo | ArcGIS Flight Component</title>
  </head>
  <body class="calcite-mode-light">
    <calcite-shell class="flight-shell">
      <calcite-navigation slot="header" class="app-header" scale="s" aria-label="ArcGIS Flight">
        <calcite-navigation-logo slot="logo" icon="plane" heading="ArcGIS Flight" description="Matterhorn"></calcite-navigation-logo>
        <div slot="content-end" class="header-actions">
        </div>
        <!-- site-navigation -->
      </calcite-navigation>
      <main class="flight-stage">
        <!-- Basemap, elevation, and initial camera are configured declaratively. -->
        <arcgis-scene
          id="scene"
          basemap="satellite"
          ground="world-elevation"
          camera-position="7.71, 46.01, 5600"
          camera-heading="235"
          camera-tilt="78"
          viewing-mode="global"
          popup-disabled
          aria-label="Matterhorn 3D scene"
        ></arcgis-scene>

        <arcgis-plane-navigation
          reference-element="scene"
          start-longitude="7.71"
          start-latitude="46.01"
          start-altitude-m="5200"
          start-heading-deg="235"
        ></arcgis-plane-navigation>

      </main>
    </calcite-shell>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
