<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=../simple-controls/" />
    <title>Geneva 3D moved to Flight controls | ArcGIS Flight Component</title>
    <script>location.replace("../simple-controls/");</script>
  <script data-site-analytics>
  (() => {
    // Local previews and copies hosted elsewhere must not send analytics.
    if (location.origin !== "https://ceddc.github.io"
      || !location.pathname.startsWith("/arcgis-flight-component/")) return;

    const queue = window._paq = window._paq || [];
    queue.push(["setTrackerUrl", "https://ceddc.ch/7"]);
    queue.push(["setSiteId", "2"]);
    queue.push(["disableCookies"]);
    queue.push(["trackPageView"]);
    queue.push(["enableLinkTracking"]);

    const script = document.createElement("script");
    script.async = true;
    script.src = "https://ceddc.ch/7";
    document.head.append(script);
  })();
</script>
</head>
  <body>
    <p>The Geneva 3D demo is now part of <a href="../simple-controls/">Flight controls</a>.</p>
  </body>
</html>
